# Реестр отделов-исполнителей (KNUS Service Desk).
# Куда уходит заявка — определяет ВЫБРАННЫЙ здесь отдел (target_department), а не .env.
#
# Как править на сервере:
#   1) отредактировать этот файл (он смонтирован в контейнер, см. docker-compose.yml);
#   2) применить: docker compose restart marketing-bot
#      (пересборка образа не нужна — файл читается при старте).
#
# Обязательное поле у enabled-отдела: planner_plan_id.
# notification_chat_id: можно указать НЕСКОЛЬКО получателей — списком YAML или через запятую:
#   notification_chat_id: [111, 222]     ИЛИ     notification_chat_id: "111, 222"
# Пустой notification_chat_id подхватывается из .env по имени <КОД>_CHAT_ID
#   (marketing → MARKETING_CHAT_ID, it → IT_CHAT_ID), там тоже можно несколько через запятую.
# У marketing из .env берутся ещё и план/сегмент (обратная совместимость):
#   planner_plan_id←PLANNER_PLAN_ID, planner_bucket_id←PLANNER_BUCKET_ID,
#   planner_bucket_name←PLANNER_BUCKET_NAME.

departments:
  marketing:
    name: Отдел маркетинга
    enabled: true
    planner_plan_id: KKQCgfi02UWlddrbSFkLY5gABUAH
    planner_bucket_id: ""            # пусто → бот найдёт сегмент по имени
    planner_bucket_name: "📥 Новые заявки"
    notification_chat_id: ""         # пусто → берётся MARKETING_CHAT_ID из .env
    assignees: []                    # пусто = общая очередь
    request_types: [design, video, social_media, website, polygraphy, event, other]
    # сегмент доски → человекочитаемый статус для заявителя (необязательно)
    bucket_status:
      "📥 Новые заявки": "🆕 Принята, ждёт очереди"
      "✅ Принято в работу": "✅ Принята в работу"
      "🎨 В производстве": "🎨 В работе"
      "👀 На согласовании": "👀 На согласовании"
      "⏸ Ожидает уточнений": "⏸ Нужны уточнения — с вами свяжутся"
      "🚀 Готово": "✅ Готово"

  it:
    name: Департамент информационных технологий
    enabled: true
    planner_plan_id: KQtVSXu0FEuZbqIuW8TIt5gAG0hT
    # отдельная колонка под заявки сервис-деска (чтобы не мешать своим задачам команды)
    planner_bucket_id: "NI85DQMFlU6KRb2EE-CVTpgAADmA"
    planner_bucket_name: "📥 Заявки Service Desk"
    notification_chat_id: ""         # пусто → берётся IT_CHAT_ID из .env (или впиши chat_id здесь)
    assignees: []                    # ← при желании впиши email-ы саппорта ДИТ; пусто = общая очередь
    request_types: [account, email, hardware, network, software, edms, website, consultation, other]
    # заявки типа edms падают в отдельную колонку (в обход общей «Заявки Service Desk»)
    type_buckets:
      edms: "7BiOeR5G10eXApJpggdlMpgABOGn"   # сегмент «📄 EDMS» в плане ДИТ
    bucket_status:
      "📥 Заявки Service Desk": "🆕 Принята, ждёт очереди"
      "📄 EDMS": "🆕 Принята, ждёт очереди"
      "Новые": "🆕 Принята, ждёт очереди"
      "В работе": "🔧 В работе"
      "На проверке": "👀 На проверке"
      "Выполнено": "✅ Выполнено"
